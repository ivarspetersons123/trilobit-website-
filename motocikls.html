(()=>{'use strict';const labels={lv:['Gads','Nobraukums','Motora tilpums','Jauda','Tiek precizēts','Cena pēc pieprasījuma','JAUTĀT PAR ŠO MOTOCIKLU →','← Atpakaļ pie motocikliem','Motocikla īstās fotogrāfijas un aprīkojuma detaļas.','Neapstiprinātie tehniskie dati nav norādīti.','Motocikli','Kontakti','JAUTĀT'],de:['Baujahr','Kilometerstand','Hubraum','Leistung','Wird geklärt','Preis auf Anfrage','ZU DIESEM MOTORRAD ANFRAGEN →','← Zurück zu den Motorrädern','Echte Motorradfotos und Ausstattungsdetails.','Nicht bestätigte technische Daten werden nicht angegeben.','Motorräder','Kontakt','ANFRAGEN'],en:['Year','Mileage','Engine capacity','Power','To be confirmed','Price on request','ASK ABOUT THIS MOTORCYCLE →','← Back to motorcycles','Genuine motorcycle photos and equipment details.','Unconfirmed technical data is not listed.','Motorcycles','Contact','ENQUIRE'],ru:['Год','Пробег','Объём двигателя','Мощность','Уточняется','Цена по запросу','СПРОСИТЬ ОБ ЭТОМ МОТОЦИКЛЕ →','← Назад к мотоциклам','Реальные фотографии мотоцикла и деталей оснащения.','Неподтверждённые характеристики не указаны.','Мотоциклы','Контакты','СПРОСИТЬ'],lt:['Metai','Rida','Variklio tūris','Galia','Tikslinama','Kaina teiraujantis','TEIRAUTIS APIE MOTOCIKLĄ →','← Grįžti prie motociklų','Tikros motociklo ir jo įrangos nuotraukos.','Nepatvirtinti techniniai duomenys nenurodomi.','Motociklai','Kontaktai','TEIRAUTIS'],pl:['Rok','Przebieg','Pojemność silnika','Moc','Do potwierdzenia','Cena na zapytanie','ZAPYTAJ O TEN MOTOCYKL →','← Powrót do motocykli','Prawdziwe zdjęcia motocykla i detali wyposażenia.','Niepotwierdzone dane techniczne nie są podawane.','Motocykle','Kontakt','ZAPYTAJ'],et:['Aasta','Läbisõit','Mootori töömaht','Võimsus','Täpsustamisel','Hind päringul','KÜSI SELLE MOOTORRATTA KOHTA →','← Tagasi mootorrataste juurde','Mootorratta ja varustuse ehtsad fotod.','Kinnitamata tehnilisi andmeid ei kuvata.','Mootorrattad','Kontakt','KÜSI']};const q=new URLSearchParams(location.search),id=q.get('id');const $=x=>document.getElementById(x);let bike,photos=[],index=0,language='lv';try{language=localStorage.getItem('trilobit-language')||'lv'}catch(e){}if(!labels[language])language='lv';$('detail-language').value=language;function setPhoto(n){if(!photos.length)return;index=(n+photos.length)%photos.length;$('gallery-main').src=photos[index];$('gallery-main').alt=bike.name+' — '+(index+1);$('gallery-count').textContent=(index+1)+' / '+photos.length;if(!$('detail-lightbox').hidden){$('lightbox-image').src=photos[index];$('lightbox-image').alt=bike.name+' — '+(index+1);$('lightbox-count').textContent=(index+1)+' / '+photos.length;}[...$('thumbs').children].forEach((b,i)=>b.setAttribute('aria-current',String(i===index)))}function render(){const l=labels[language];document.documentElement.lang=language;$('nav-bikes').textContent=l[10];$('nav-contact').textContent=l[11];$('nav-ask').textContent=l[12];$('back').textContent=l[7];$('photo-note').textContent=l[8];$('info-note').textContent=l[9];$('ask-bike').textContent=l[6];if(!bike)return;$('bike-price').textContent=(!bike.price||bike.price==='Cena pēc pieprasījuma')?l[5]:bike.price;const values=[bike.year,bike.mileage,bike.engine_cc,bike.power];$('specs').replaceChildren();for(let i=0;i<4;i++){const box=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=l[i];dd.textContent=values[i]||l[4];box.append(dt,dd);$('specs').append(box)}$('bike-desc').textContent=bike.description||l[4]}
let lightboxReturnFocus=null;function openLightbox(){if(!photos.length)return;lightboxReturnFocus=document.activeElement;const box=$('detail-lightbox');box.hidden=false;$('lightbox-image').src=photos[index];$('lightbox-image').alt=bike.name+' — '+(index+1);$('lightbox-count').textContent=(index+1)+' / '+photos.length;document.body.classList.add('lightbox-open');$('lightbox-close').focus()}function closeLightbox(){const box=$('detail-lightbox');if(box.hidden)return;box.hidden=true;document.body.classList.remove('lightbox-open');if(lightboxReturnFocus&&lightboxReturnFocus.focus)lightboxReturnFocus.focus()}$('gallery-main').addEventListener('click',openLightbox);$('gallery-main').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLightbox()}});$('lightbox-close').addEventListener('click',closeLightbox);$('detail-lightbox').addEventListener('click',e=>{if(e.target===$('detail-lightbox'))closeLightbox()});$('lightbox-prev').addEventListener('click',()=>setPhoto(index-1));$('lightbox-next').addEventListener('click',()=>setPhoto(index+1));document.addEventListener('keydown',e=>{if($('detail-lightbox').hidden)return;if(e.key==='Escape')closeLightbox();else if(e.key==='ArrowLeft')setPhoto(index-1);else if(e.key==='ArrowRight')setPhoto(index+1)});$('detail-language').addEventListener('change',e=>{language=e.target.value;try{localStorage.setItem('trilobit-language',language)}catch(e){}render()});$('prev').addEventListener('click',()=>setPhoto(index-1));$('next').addEventListener('click',()=>setPhoto(index+1));fetch('data/bikes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{bike=(d.bikes||[]).find(b=>b.id===id&&!b.hidden);if(!bike){$('bike-name').textContent='Motocikls nav atrasts';return}$('bike-name').textContent=bike.name;document.title=bike.name+' — TRILOBIT';photos=(bike.gallery||[bike.image]).filter(Boolean);$('thumbs').replaceChildren();photos.forEach((p,i)=>{const b=document.createElement('button'),im=document.createElement('img');im.src=p;im.alt=bike.name+' — '+(i+1);b.type='button';b.append(im);b.addEventListener('click',()=>{setPhoto(i);openLightbox()});$('thumbs').append(b)});setPhoto(0);const a=$('ask-bike');a.href='index.html?bike='+encodeURIComponent(bike.name)+'#contact';render()}).catch(()=>{$('bike-name').textContent='Neizdevās ielādēt motocikla datus'});render()})();
</script></body></html>
